<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>公告抽取核验 · 比赛原型</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><div class="mark">证</div><div><h1>公告抽取核验</h1><p>中标事件结构化提取 · 金额校验 · 原文溯源</p></div><span id="data-kind" class="pill">数据类别待确认</span></header>
  <main>
    <div id="run-notice" class="notice">页面读取所选运行结果，点击和刷新不调用模型。</div>
    <form id="result-form" class="notice"><label for="result-path">运行结果路径</label> <input id="result-path" size="42" value="outputs/result.json" required> <button type="submit">查看结果</button><p>先通过命令行处理新公告，再填入对应的 outputs/运行目录/result.json。</p></form>
    <section id="summary" class="summary" aria-label="试跑结果"></section>
    <div class="layout">
      <section class="panel records-panel"><div class="section-title"><h2>提取的中标事件</h2><span id="run-mode"></span></div><div id="records"></div>
        <div class="section-title detail-title"><h2>字段与证据</h2><small>点击有来源的字段，定位右侧原文</small></div>
        <div id="details"></div>
        <div id="issues"></div>
        <section id="review-panel" class="notice" aria-label="人工复核">
          <h3>人工复核</h3>
          <p>复核保存在当前浏览器，导出后可交给团队。原始结果和自动评测不会被覆盖。</p>
          <form id="review-form">
            <p><label>字段 <select id="review-field"></select></label></p>
            <p><label>处理 <select id="review-action"><option value="confirmed">确认原值</option><option value="corrected">提出修改</option><option value="unresolved">仍需复核</option></select></label></p>
            <p><label>建议值 <input id="review-value"></label></p>
            <p><label>复核人 <input id="reviewer" required></label></p>
            <p><label>依据或疑点 <textarea id="review-note" rows="2"></textarea></label></p>
            <button type="submit">保存复核记录</button>
          </form>
          <p id="review-status" aria-live="polite"></p><div id="review-history"></div>
          <button id="export-review" type="button">导出结果及复核日志</button>
        </section>
      </section>
      <section class="panel document-panel"><div class="section-title"><h2>原始公告</h2><span id="file-name"></span></div>
        <div class="toolbar"><button id="prev" aria-label="上一页">←</button><span id="page-number"></span><button id="next" aria-label="下一页">→</button><span class="legend">黄色区域为字段原文</span></div>
        <div id="pdf-scroll"><div id="paper"><canvas id="pdf"></canvas><div id="highlights"></div></div></div>
        <p id="evidence-caption" class="caption" aria-live="polite"></p>
      </section>
    </div>
    <footer><span id="evaluation-scope">所选运行的评测范围待加载。</span><div><a id="result-link" href="../../outputs/result.json" target="_blank" rel="noopener">结构化结果</a><a id="metrics-link" href="../../outputs/metrics.json" target="_blank" rel="noopener">评测明细</a><a id="trace-link" href="../../outputs/trace.jsonl" target="_blank" rel="noopener">执行日志</a></div></footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
